# Alembic configuration for the AegisAxiom PostgreSQL re-platform (Phase 0).
#
# The database URL is intentionally NOT set here. env.py reads it from the
# DATABASE_URL environment variable (asyncpg URL) so the connection string is
# never hardcoded and a managed-Postgres swap is a config change. See
# .claude/plans/postgres-migration-plan.md §A10 / OQ-6.

[alembic]
# Path to migration scripts, relative to this file (run alembic from backend/).
script_location = alembic

# Make backend/ importable from env.py (so `import db.base`, `import repositories...` work).
prepend_sys_path = .

# Timezone-naive UTC timestamps in generated revision files.
# (No hardcoded sqlalchemy.url — DATABASE_URL is read in env.py.)

# Migration filename template: zero-padded numeric prefix + slug.
# We hand-author revision ids (e.g. 0001_baseline), so this only affects
# any future `alembic revision --autogenerate` scaffolding.
file_template = %%(rev)s_%%(slug)s

[post_write_hooks]
# (none)

# Logging configuration.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S