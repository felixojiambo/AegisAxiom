services:
  mongo:
    image: mongo:7
    container_name: aegisaxiom-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  chromadb:
    image: chromadb/chroma:latest
    container_name: aegisaxiom-chromadb
    restart: unless-stopped
    ports:
      - "8100:8000"
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      - ANONYMIZED_TELEMETRY=false
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/8000'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # PostgreSQL re-platform (Phase 0): parallel-run datastore. Mongo + chromadb
  # remain the LIVE stores this phase — postgres is added alongside, nothing is
  # removed. pgvector image ships the `vector` extension; the baseline Alembic
  # migration also enables `pg_trgm`. See postgres-migration-plan.md §A10.
  postgres:
    image: pgvector/pgvector:pg16
    container_name: aegisaxiom-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=aegis
      - POSTGRES_PASSWORD=aegis
      - POSTGRES_DB=aegis
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aegis -d aegis"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aegisaxiom-backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8001:8001"
    volumes:
      - ./backend:/app/backend
      - backend_uploads:/app/backend/uploads
      - /app/backend/__pycache__
      - /app/backend/services/bpmn/node_helpers/node_modules
    env_file:
      - ./backend/.env
    environment:
      # Async SQLAlchemy engine target. Read lazily — the app does NOT connect to
      # Postgres at boot in Phase 0 (Mongo is still the live store), so postgres
      # is intentionally NOT in depends_on below: the backend boots even if
      # Postgres is down. See db/session.py.
      - DATABASE_URL=postgresql+asyncpg://aegis:aegis@postgres:5432/aegis
    depends_on:
      mongo:
        condition: service_healthy
      chromadb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    container_name: aegisaxiom-frontend
    restart: unless-stopped
    ports:
      # Bind to IPv4 host loopback only so Docker Desktop never sets up
      # the broken IPv6 forwarder on ::1:3000. Chrome resolves localhost
      # to ::1 first on Windows. Without this bind it hits the IPv6
      # forwarder which accepts the handshake then resets the response
      # which surfaces as ERR_CONNECTION_RESET. With this bind the IPv6
      # attempt fails fast and Happy Eyeballs falls back to IPv4 which
      # routes through the working forwarder.
      - "127.0.0.1:3000:3000"
    volumes:
      - ./frontend/src:/app/frontend/src
      - ./frontend/public:/app/frontend/public
      - ./frontend/craco.config.js:/app/frontend/craco.config.js
      - ./frontend/plugins:/app/frontend/plugins
    env_file:
      - ./frontend/.env
    environment:
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
      - HOST=0.0.0.0
      - DANGEROUSLY_DISABLE_HOST_CHECK=true
      - WDS_SOCKET_HOST=localhost
      - WDS_SOCKET_PORT=0
    depends_on:
      backend:
        condition: service_healthy
    stdin_open: true

volumes:
  mongo_data:
  backend_uploads:
  chroma_data:
  pg_data:
