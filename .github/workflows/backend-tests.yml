name: backend-tests

# Phase 0 (Postgres re-platform): runs the backend test suite with a real
# Postgres available so the new repository/ORM tests execute (not just skip),
# while the existing mongomock-motor tests continue to run unchanged.

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest

    # Primary CI path for the Postgres tests (plan §A11): a dedicated pgvector
    # service database. TEST_DATABASE_URL points the pg_* fixtures at it.
    services:
      postgres-test:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: aegis
          POSTGRES_PASSWORD: aegis
          POSTGRES_DB: aegis_test
        ports:
          - 5544:5432
        options: >-
          --health-cmd "pg_isready -U aegis -d aegis_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Backend reads these at import (Mongo is still the live store this phase).
      # A reachable Mongo is required for the full server import; the unit/ORM
      # tests below don't need it, so we only set what the suite needs.
      TEST_DATABASE_URL: postgresql+asyncpg://aegis:aegis@localhost:5544/aegis_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          # emergentintegrations is not on PyPI (provided natively in Emergent);
          # skip it here, matching backend/Dockerfile.
          grep -v 'emergentintegrations' requirements.txt > requirements.ci.txt
          pip install --no-cache-dir -r requirements.ci.txt

      - name: Verify Alembic upgrade/downgrade against empty Postgres
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://aegis:aegis@localhost:5544/aegis_test
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

      - name: Run pytest
        working-directory: backend
        run: pytest -q
