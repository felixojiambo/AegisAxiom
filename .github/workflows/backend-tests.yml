name: backend-tests

# The enforced OUTER loop of the Postgres migration harness (H4).
#
# Three jobs, three different failure modes closed:
#   pg-tests   real Postgres from docker-compose.test.yml; a run where the PG
#              suite SKIPS fails the job. Skipped-as-green is the failure mode
#              this job exists to kill, so it is asserted on pytest OUTPUT, not
#              just on the exit code (pytest exits 0 when everything skips).
#   zero-grep  scripts/verify.sh --grep over every completed-phase pattern file,
#              so a merged regression that reintroduces `db.users` (either the
#              attribute or the subscript form) can never land silently.
#   full-suite the existing mongomock-motor suites, running as-is until their
#              domains migrate. Kept intentionally separate: those tests have
#              legitimate skips, and folding them in would blunt the PG
#              skip-as-fail assertion above.
#
# scripts/verify.sh --native runs python on the runner (deps installed here,
# service DB reachable directly) instead of in a container — same profiles, same
# assertions, same output grammar as a developer's local run.

on:
  push:
  pull_request:

jobs:
  # ------------------------------------------------------------------
  # 1. Postgres suites — real pass counts required, skips are failures
  # ------------------------------------------------------------------
  pg-tests:
    runs-on: ubuntu-latest
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://aegis:aegis@localhost:5544/aegis_test
      PG_TEST_GLOB: tests/test_platform_core_*_pg.py

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Same compose file developers use locally — one source of truth for the
      # test database (image, credentials, published port 5544).
      - name: Start the test Postgres (docker-compose.test.yml)
        run: |
          docker compose -f docker-compose.test.yml up -d
          for i in $(seq 1 30); do
            if docker compose -f docker-compose.test.yml exec -T postgres-test \
                 pg_isready -U aegis -d aegis_test >/dev/null 2>&1; then
              echo "postgres-test ready after ${i} attempt(s)"; exit 0
            fi
            sleep 2
          done
          echo "::error::postgres-test never became ready"
          docker compose -f docker-compose.test.yml logs postgres-test
          exit 1

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          # emergentintegrations is not on PyPI (provided natively in Emergent);
          # skip it here, matching backend/Dockerfile.
          grep -v 'emergentintegrations' requirements.txt > requirements.ci.txt
          pip install --no-cache-dir -r requirements.ci.txt

      # Alembic round-trip + the PG suites, through the same harness the agent
      # runs locally. verify.sh already fails on skipped>0; the explicit
      # assertion below re-proves it from the raw output so the rule is visible
      # in this file and cannot rot silently inside the script.
      - name: Verify — alembic round-trip + Postgres suites
        run: |
          set -o pipefail
          bash scripts/verify.sh --native --alembic --tests "$PG_TEST_GLOB" \
            | tee verify-pg.log

      - name: Assert PG tests actually RAN (skip-as-green is a failure)
        run: |
          line="$(grep -E '^\[tests\] (PASS|FAIL)' verify-pg.log | tail -1)"
          echo "summary: ${line:-<none>}"
          if [ -z "$line" ]; then
            echo "::error::no [tests] summary line — the PG suite never reported"
            exit 1
          fi
          passed="$(sed -n 's/.*passed=\([0-9]\+\).*/\1/p' <<< "$line")"
          skipped="$(sed -n 's/.*skipped=\([0-9]\+\).*/\1/p' <<< "$line")"
          if [ "${skipped:-1}" -ne 0 ]; then
            echo "::error::${skipped} Postgres test(s) SKIPPED. A skipped PG test is a FAILED PG test:"
            echo "::error::it means TEST_DATABASE_URL was unreachable and the suite proved nothing."
            grep -E 'SKIPPED|SKIP-AS-FAIL' verify-pg.log || true
            exit 1
          fi
          if [ "${passed:-0}" -lt 1 ]; then
            echo "::error::0 Postgres tests passed — the suite did not execute"
            exit 1
          fi
          echo "PG suite executed for real: passed=${passed} skipped=${skipped}"

      - name: Tear down the test Postgres
        if: always()
        run: docker compose -f docker-compose.test.yml down -v

  # ------------------------------------------------------------------
  # 2. Zero-grep — a merged seam regression can never land silently
  # ------------------------------------------------------------------
  zero-grep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Every scripts/greps/*.txt is enforced, so a future phase's pattern file
      # takes effect the moment it is added. Needs no Python, no Docker, no
      # database — pure source inspection, so it is the fastest signal in CI.
      - name: Verify — zero-grep over all completed-phase pattern files
        run: |
          set -o pipefail
          shopt -s nullglob
          files=(scripts/greps/*.txt)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::no pattern files under scripts/greps/ — the zero-grep gate is empty"
            exit 1
          fi
          args=()
          for f in "${files[@]}"; do args+=(--grep "$f"); done
          echo "enforcing: ${files[*]}"
          bash scripts/verify.sh "${args[@]}"

  # ------------------------------------------------------------------
  # 3. Existing mongomock-motor suites — unchanged until their domains migrate
  # ------------------------------------------------------------------
  full-suite:
    runs-on: ubuntu-latest
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://aegis:aegis@localhost:5544/aegis_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Brought up here too so the PG-backed tests inside the full suite run for
      # real rather than skipping. Unmigrated domains keep using mongomock.
      - name: Start the test Postgres (docker-compose.test.yml)
        run: |
          docker compose -f docker-compose.test.yml up -d
          for i in $(seq 1 30); do
            if docker compose -f docker-compose.test.yml exec -T postgres-test \
                 pg_isready -U aegis -d aegis_test >/dev/null 2>&1; then
              echo "postgres-test ready after ${i} attempt(s)"; exit 0
            fi
            sleep 2
          done
          echo "::error::postgres-test never became ready"
          exit 1

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          grep -v 'emergentintegrations' requirements.txt > requirements.ci.txt
          pip install --no-cache-dir -r requirements.ci.txt

      # Whole suite, as-is. Skips are tolerated HERE (mongomock tests skip for
      # their own reasons, e.g. absent TEST_ADMIN_PASSWORD); the PG-specific
      # skip-as-fail rule is enforced by the pg-tests job above.
      - name: Run pytest (full suite, mongomock domains included)
        working-directory: backend
        run: pytest -q

      - name: Tear down the test Postgres
        if: always()
        run: docker compose -f docker-compose.test.yml down -v
