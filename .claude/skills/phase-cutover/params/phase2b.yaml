# Phase 2b — Platform core: RBAC, governance, observability.
#
# The first live instance of /phase-cutover. Every value below is derived from
# .claude/plans/postgres-migration-plan.md (Phase 2, 2b block; §A4/§A6/§A7;
# OQ-10) and .claude/plans/phase2b-census.md, which is already written and
# recommends PROCEED. Names only — no secret values appear in this file.

phase: "2b"
title: "roles, permissions, policies/policy_targets, audit_logs; validate_dag port; roles_legacy_read deletion"
plan_ref:
  - "postgres-migration-plan.md Phase 2 (2b block)"
  - "§A4 search (distinct → SELECT DISTINCT, trigram GIN)"
  - "§A6 CAS + transactions"
  - "§A7 validate_dag + SKIP_STARTUP_DAG_VALIDATION"
  - "OQ-10 duplicate api_errors router"

census: ".claude/plans/phase2b-census.md"   # COMPLETE — re-verify counts, do not rewrite
census_verdict: "PROCEED (one scope trim: api_errors is not a collection — see sweeps)"

# --------------------------------------------------------------------------
# Collections. ~122 refs / ~22 files per census §1.
# The grep pattern file MUST cover BOTH access forms for each of these:
#   (?<!\x60)\bdb\.<name>\b     and     db\[\s*["']<name>["']\s*\]
# Phase 2a shipped with 28 live db["users"] sites because only the first form
# was checked. Do not repeat that.
# --------------------------------------------------------------------------
collections:
  - name: roles
    refs: 50
    ddl: "roles(role_id text PK, name text UNIQUE, display_name, description, color, is_system, is_default, permissions jsonb, created_at, updated_at)"
    notes: "permissions is an opaque key list — JSONB, never a child table"
  - name: permissions
    refs: 18
    ddl: "permissions(key text PK, \"group\", label, source, app_id, is_active, implies jsonb, created_at, updated_at)"
    notes: "key is the natural PK (all upserts keyed on it); implies jsonb holds the DAG edges"
  - name: policies
    refs: 17
    ddl: "policies(policy_id text PK, name, description, module, entity, enabled, is_system, priority, trigger jsonb, condition_logic, condition_pattern, conditions jsonb, actions jsonb, created_by, created_at, updated_at, deleted_at)"
    notes: "index (module, entity) for engine lookup; (enabled) WHERE deleted_at IS NULL"
  - name: policy_targets
    refs: 11
    ddl: "policy_targets(id bigserial PK, policy_id text FK->policies ON DELETE CASCADE, target_type, target_id, tenant_id, created_at)"
    notes: "schemaless today — PIN the final columns by reading all 11 sites during implementation, not from this sketch"
  - name: audit_logs
    refs: 26
    ddl: "audit_logs(id bigserial PK, event_category, event_type, severity, actor_id, actor_email, resource_type, resource_id, action, outcome, details jsonb, timestamp timestamptz)"
    notes: >-
      Hot WRITE path (fires on ~every mutating request) — index for writes, not
      just reads. Mirror the retired Mongo index set: (timestamp DESC),
      (event_category,timestamp DESC), (event_type,timestamp DESC),
      (actor_id,timestamp DESC), (resource_type,resource_id,timestamp DESC).
      §A4 trigram GIN on the text columns the list endpoint searches.

# --------------------------------------------------------------------------
# Alembic lane claim. CLAIMED — a second lane must pick a different number.
# --------------------------------------------------------------------------
migration_revision: "0005_platform_core_rbac"
down_revision: "0004_drop_scaffolding_hello"   # head at claim time (2026-08-02)
lane_note: >-
  0005 is claimed by this phase. Any concurrent lane must claim 0006+ BEFORE it
  starts and record the claim in its own params file. A collision is a STOP, not
  a renumber. If another lane lands 0005 first, rebase down_revision onto the new
  head BEFORE running the Alembic round-trip.

# --------------------------------------------------------------------------
# Files. Anything not listed here is out of scope for this phase.
# --------------------------------------------------------------------------
