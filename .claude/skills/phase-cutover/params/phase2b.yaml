# Phase 2b — Platform core: RBAC, governance, observability.
#
# The first live instance of /phase-cutover. Every value below is derived from
# .claude/plans/postgres-migration-plan.md (Phase 2, 2b block; §A4/§A6/§A7;
# OQ-10) and .claude/plans/phase2b-census.md, which is already written and
# recommends PROCEED. Names only — no secret values appear in this file.

phase: "2b"
title: "roles, permissions, policies/policy_targets, audit_logs; validate_dag port; roles_legacy_read deletion"
plan_ref:
  - "postgres-migration-plan.md Phase 2 (2b block)"
  - "§A4 search (distinct → SELECT DISTINCT, trigram GIN)"
  - "§A6 CAS + transactions"
  - "§A7 validate_dag + SKIP_STARTUP_DAG_VALIDATION"
  - "OQ-10 duplicate api_errors router"

census: ".claude/plans/phase2b-census.md"   # COMPLETE — re-verify counts, do not rewrite
census_verdict: "PROCEED (one scope trim: api_errors is not a collection — see sweeps)"
census_reverify:
  date: "2026-11-25"
  tree: "16381be"
  verdict: "PROCEED after operator rulings below; no open traces"
  counts: "119 live attr-form lines / 21 files (roles 48, permissions 18, policies 17, policy_targets 11, audit_logs 25); subscript form 0 for all five"
  rulings:
    - "policy_targets: census sketch was wrong (no policy_id). Transcribe the real target-registry shape; no FK to policies. STOP resolved by operator."
    - "audit_logs: audit_id is the TEXT PK (CLAUDE.md §3); DDL widened to the union of all writer shapes."
    - "Scope +3: seeds/seed_projects_rbac.py; services/ingestion/repository.py (audit_logs write ONLY); services/workflow_executor.py (migrated-target guard ONLY)."
    - "CLAUDE.md shim table corrected to true post-2b state (edit lands in step 7)."
  binding_decisions_2026_11_27:
    - id: 1
      decision: "contract endpoint for policies is /api/admin/policies"
      status: "CONFIRMED in contract_endpoints below (landed in 5f699df)"
    - id: 2
      decision: "roles.permissions stays JSONB with the GIN containment index (ix_roles_permissions_gin, jsonb_ops)"
      status: "IMPLEMENTED in 0005; exception recorded in backend/repositories/CONVENTIONS.md (Phase 2b additions, rule 2)"
      why: "a role_permissions join table with an FK to permissions.key rejects the wildcard grants (\"*\", \"<module>:*\")"
    - id: 3
      decision: "ingestion moves only its 2b writes onto the 2b repositories; all other ingestion collections stay on Mongo until Phase 8"
      status: "IMPLEMENTED"
      note: >-
        As worded ("services/ingestion/repository.py moves only its permission and role
        writes") the premise does not hold: re-verified 2026-11-27, repository.py has NO
        role/permission writes (collections: app_registry, app_modules, app_ingestion_log,
        ingestion_artifacts, ingestion_field_catalogue, ingestion_state). Its only 2b site,
        the audit_logs insert in log_stage, moved to write_audit_entry. Ingestion's role and
        permission writes live in rbac_generator.py and service.py, and both moved to the
        roles/permissions repositories. The in_scope_files limit below stands.
    - id: 4
      decision: "workflow_executor rejects writes to any collection migrated through 2b"
      status: "IMPLEMENTED: _POSTGRES_MIGRATED_COLLECTIONS guard in _get_collection, called only by update_field / create_record / delete_record; tested in test_platform_core_rbac_pg.py"
      stored_rules_check: "2026-11-27 dev Mongo: 8 workflow_rules, 0 with trigger.module or actions.module in a 2b module/collection; stop_conditions[6] does not fire"
    - id: 5
      decision: "find and fix code that compares or sorts timestamp strings drawn from both Postgres and Mongo"
      status: "SEARCHED, 0 sites found, nothing to fix"
      evidence: >-
        Every consumer of the 2b repositories reads only Postgres timestamps:
        projects_recent_changes.fetch_recent_changes, whose shadow-dedup buckets on
        datetime.timestamp() rather than strings; pmo.py, which appends rows but never sorts
        them; routes/audit.py; and contract_approval_access, which sorts by name and email.
        Python sorted()/.sort() keys and frontend localeCompare / < comparisons on
        created_at/at/timestamp touch Mongo-only data. Adjacent finding, not fixed (Mongo-only,
        out of scope): routes/projects_dashboard.py _sort_key sorts changed_at as strings
        mixing datetime.isoformat() and stored ISO strings. Rule recorded in CONVENTIONS
        (Phase 2b additions, rule 6).
    - id: 6
      decision: "DEFAULT_ROLE_PERMISSIONS is deleted from routes/auth.py"
      status: "IMPLEMENTED: 0 live hits; _build_user_with_permissions(user, pg) reads RolesRepository.get_role_permissions at all 6 call sites"
  dynamic_path_trace: >-
    field_registry maps module `audit`->audit_logs and `roles`->roles. Neither
    emits events nor registers a date field, so event/date-triggered workflow
    rules cannot fire on them. Workflow ACTIONS (update_field, create_record,
    delete_record) resolve action.module -> db[collection] with no server-side
    target validation: a live Mongo write path to two migrated collections,
    invisible to the zero-grep. Closed by the workflow_executor guard.
    ai/schema.discover samples every Mongo collection at startup but nothing
    consumes the 2b entries (inert). data_fetcher / pmo use fixed collection
    lists. Not verified: stored workflow_rules targeting roles/audit (Docker
    was down at census time).

# --------------------------------------------------------------------------
# Collections. ~122 refs / ~22 files per census §1.
# The grep pattern file MUST cover BOTH access forms for each of these:
#   (?<!\x60)\bdb\.<name>\b     and     db\[\s*["']<name>["']\s*\]
# Phase 2a shipped with 28 live db["users"] sites because only the first form
# was checked. Do not repeat that.
# --------------------------------------------------------------------------
collections:
  - name: roles
    refs: 48
    ddl: "roles(role_id text PK, name text UNIQUE, display_name, description, color, is_system, is_default, permissions jsonb, created_at, updated_at)"
    notes: "permissions is an opaque key list — JSONB, never a child table"
  - name: permissions
    refs: 18
    ddl: "permissions(key text PK, \"group\", label, source, app_id, is_active, implies jsonb, created_at, updated_at)"
    notes: "key is the natural PK (all upserts keyed on it); implies jsonb holds the DAG edges"
  - name: policies
    refs: 17
    ddl: "policies(policy_id text PK, name, description, module, entity, enabled, is_system, priority, trigger jsonb, condition_logic, condition_pattern, conditions jsonb, actions jsonb, created_by, created_at, updated_at, deleted_at)"
    notes: "index (module, entity) for engine lookup; (enabled) WHERE deleted_at IS NULL"
  - name: policy_targets
    refs: 11
    ddl: "policy_targets(app_id text, module text, entity text, event text, is_active boolean NOT NULL DEFAULT true, created_at timestamptz, updated_at timestamptz, PRIMARY KEY (app_id, module, entity, event))"
    notes: >-
      PINNED from all 11 sites (writer ingestion/service.py:413; readers
      policy_engine.py:517, routes/audit.py:166, ingestion/reconcile.py:179;
      Mongo indexes server.py:767-772). A target registry keyed on
      (app_id, module, entity, event) — NOT a policy->target join. NO policy_id,
      NO FK to policies (operator ruling 2026-11-25). app_id actually stores the
      app SLUG (reconcile.py:174, load-bearing) — column comment, do not rename.
      Indexes: (app_id, is_active), (module, entity, is_active). The
      `"policy_targets" in list_collection_names()` existence guards at the
      readers are Mongo-only and die with the port.
  - name: audit_logs
    refs: 25
    ddl: >-
      audit_logs(audit_id text PK, event_category text NULL, event_type, severity,
      actor_id, actor_user_id, actor_email, actor_type, tool_name, tenant_id,
      resource_type, resource_id, action, outcome, result_status, error_detail,
      session_id, tier, params jsonb, details jsonb NOT NULL DEFAULT '{}',
      timestamp timestamptz NOT NULL DEFAULT now())
    notes: >-
      audit_id is the TEXT PK (operator ruling; every writer generates it;
      audit_service.py:131 looks it up for idempotency -> becomes
      INSERT ... ON CONFLICT (audit_id) DO NOTHING). DDL is the union of all
      writer shapes (security_logger, audit_service x2, conversational_tools,
      ingestion/repository). event_category NULLABLE: legacy rows lack it and
      routes/audit.py maps $exists:false -> IS NULL. Hot WRITE path. Carry over
      the retired Mongo index set: (timestamp DESC), (event_category,timestamp
      DESC), (event_type,timestamp DESC), (actor_id,timestamp DESC),
      (actor_email,timestamp DESC), (resource_type,resource_id,timestamp DESC).
      §A4 trigram GIN on resource_type — the only $regex-searched column
      (anchored prefix, routes/audit.py). Filtered columns needing support:
      tenant_id, actor_user_id, details->'after'->>'project_id',
      details->'before'->>'project_id' (projects_recent_changes).

